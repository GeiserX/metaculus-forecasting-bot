[project]
name = "metaculus-forecasting-bot"
version = "0.1.0"
description = "Forecasting bot for the Metaculus FutureEval tournaments, running on Claude Code headless"
authors = [{ name = "GeiserX" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "forecasting-tools>=0.2.90,<0.4.0",
    "python-dotenv>=1.0.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { forecasting-tools = false }
# forecasting-tools caps pillow below 13, and 13.0.0 is the only release with the fixes for
# GHSA-xvh5-g6gv-559v and the other 2026-10 Pillow advisories. It only calls Image.open,
# convert and save, which 13 keeps. Remove this once forecasting-tools allows pillow 13.
# asknews caps cryptography below 49.0.1 (0.14.10, the newest), and 50.0.0 is the first release
# with the fix for GHSA-g6cj-pr64-35w5. asknews only uses Fernet, PBKDF2HMAC, hashes and
# default_backend, which 50 keeps. Remove this once asknews allows cryptography 50.
override-dependencies = ["pillow>=13.0.0", "cryptography>=50.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
